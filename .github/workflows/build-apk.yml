name: Build FongMi TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fongmi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create signing keystore and local.properties
        run: |
          keytool -genkeypair -v -keystore release.keystore -storepass fongmi123 -keypass fongmi123 -alias fongmi -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FongMi TV, OU=Build, O=FongMi, L=CN, ST=CN, C=CN"
          printf 'storeFile=../release.keystore\nkeyAlias=fongmi\nstorePassword=fongmi123\n' > local.properties
          cat local.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build leanback arm64 release
        run: ./gradlew :app:assembleLeanbackArm64Release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-tv-leanback-arm64
          path: app/build/outputs/apk/leanback/arm64/release/*.apk